name: Encrypted database backup

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

# Backups are stored as release assets of the PRIVATE repository in BACKUP_REPO, written with a fine-grained
# token scoped to that repository only. Nothing is written to this public repository or to Cloudflare R2.
permissions:
  contents: read

concurrency:
  group: backup-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        target: [prod, staging]
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL 17 client and age
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common age
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y >/dev/null
          sudo apt-get install -y -qq postgresql-client-17
      - name: Export, encrypt, store, verify
        env:
          BACKUP_ENV: ${{ matrix.target }}
          PROD_DATABASE_URL: ${{ secrets.PROD_BACKUP_DATABASE_URL }}
          STAGING_DATABASE_URL: ${{ secrets.STAGING_BACKUP_DATABASE_URL }}
          # Independent recovery recipient (Drive identity + owner passphrase) and historical recipient.
          AGE_RECIPIENTS: ${{ vars.BACKUP_AGE_RECIPIENTS }}
          BACKUP_REPO: PradnyaPrameswara/digidaws-backups
          GH_TOKEN: ${{ secrets.BACKUP_STORE_TOKEN }}
          RETENTION_DAYS: '30'
        run: bash backup.sh
